# clamd is started by the worker for the duration of a run (MAILCAT_CLAMAV_MODE=managed) and
# only listens on the container's loopback interface.
Foreground yes
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /data/clamav
PidFile /tmp/clamd.pid
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxThreads 2
ScanArchive yes
AlertEncrypted no
AlertOLE2Macros yes
ConcurrentDatabaseReload no

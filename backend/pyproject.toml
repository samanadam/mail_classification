[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcat"
version = "1.0.0"
description = "Local, self-hosted mail categorizer: IMAP ingest, local classification, dashboard, write-back and retention."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "imap-tools>=1.7",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "nh3>=0.2.17",
    "tldextract>=5.1",
    "msal>=1.28",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The classifier stack is only installed in the worker image. The API never loads a model.
model = ["laya>=0.3.24"]
onnx = ["laya[onnx]>=0.3.24"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
mailcat = "mailcat.cli:main"

[tool.setuptools.packages.find]
include = ["mailcat*"]

[tool.setuptools.package-data]
mailcat = ["py.typed", "migrations/env.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "imap: needs the GreenMail IMAP test server (MAILCAT_TEST_IMAP_HOST)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mailcat/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S607: clamd, freshclam, gpg, pg_dump are resolved from the container's PATH on purpose.
# S110: best-effort cleanup and header-decoding fallbacks swallow errors by design.
ignore = ["S101", "S311", "B008", "S608", "S607", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
